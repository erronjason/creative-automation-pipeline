[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "creative-automation-pipeline"
version = "0.1.0"
description = "Proof-of-concept GenAI creative automation pipeline for localized social ad campaigns."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jason Sayre" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "pillow>=10.3",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "ruff>=0.16.8,<0.17", "moto[s3]>=5.0", "boto3>=1.34"]  # ruff pinned: new lint rules must not turn CI red

[project.scripts]
cap = "cap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
