# Example campaign brief. YAML (or JSON) validated against cap.brief.Brief.
campaign:
  id: summer-refresh-2026
  name: Summer Refresh 2026
  brand: ../brand/tidewell/brand.yaml
  source_locale: en-US
  message: Summer, freshly poured.
  cta: Find it near you
  visual_direction: sunlit outdoor summer table, late afternoon golden light

target:
  region: North America
  audience: Active adults 25-40 who prefer low-sugar drinks and weekend outdoor plans
  markets:
    - { code: US, locale: en-US }
    - { code: MX, locale: es-MX }
    - { code: CA-QC, locale: fr-CA }   # no approved copy below: machine-translated (or flagged)

products:
  - id: sparkling-yuzu
    name: Tidewell Sparkling Yuzu
    description: slim teal aluminum can of lightly sparkling yuzu citrus water, 0 g sugar
    # assets/sparkling-yuzu/hero.png exists -> reused, never regenerated
  - id: cold-brew-tonic
    name: Tidewell Cold Brew Tonic
    description: tall clear glass bottle of cold brew coffee with tonic, amber color, teal cap
    scene: picnic blanket in a sunny park, ice cubes, fresh orange slices
    # no asset in assets/cold-brew-tonic/ -> hero generated by the image provider

aspect_ratios: ["1:1", "9:16", "16:9"]

# Human-approved (transcreated) copy. Always preferred over machine translation.
localized_copy:
  es-MX:
    message: El verano, recién servido.
    cta: Encuéntralo cerca
